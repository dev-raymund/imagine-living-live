title: Development
sections:
  main:
    display: Main
    fields:
      -
        handle: listing_status
        field:
          options:
            live: Live
            new: New
            sold: Sold
            coming-soon: 'Coming soon'
          multiple: false
          clearable: false
          searchable: true
          taggable: false
          push_tags: false
          cast_booleans: false
          display: 'Listing status'
          type: select
          icon: select
          width: 50
          listable: true
          instructions_position: above
      -
        handle: price_range
        field:
          input_type: text
          antlers: false
          display: 'Price Range'
          type: text
          icon: text
          width: 50
          listable: true
          instructions_position: above
      -
        handle: price_from
        field:
          type: integer
          display: 'Price from (GBP)'
          instructions: 'Lowest price in pounds (no £ or commas). Used for sorting and max-price filter. Run `php artisan developments:sync-prices` to fill from Price Range.'
          width: 50
          listable: false
          instructions_position: above
      -
        handle: title
        field:
          type: text
          required: true
          width: 33
          validate:
            - required
          display: Name
          instructions_position: above
          listable: true
          input_type: text
          antlers: false
      -
        handle: subtitle
        field:
          input_type: text
          antlers: false
          display: Area
          type: text
          icon: text
          width: 33
          listable: true
          instructions_position: above
      -
        handle: caption
        field:
          input_type: text
          antlers: false
          display: Caption
          type: text
          icon: text
          width: 33
          listable: false
          instructions_position: above
      -
        handle: property_type
        field:
          input_type: text
          antlers: false
          display: 'Property type'
          type: text
          icon: text
          width: 50
          listable: false
          instructions: 'e.g. Apartment, House, Studio'
          instructions_position: above
      -
        handle: size_sq_ft
        field:
          type: integer
          display: 'Size (sq ft)'
          icon: integer
          width: 50
          listable: false
          instructions_position: above
      -
        handle: bedrooms
        field:
          type: integer
          display: Bedrooms
          instructions: 'Smallest home in the development. On its own this shows as e.g. "2 bedrooms".'
          icon: integer
          width: 50
          listable: false
          instructions_position: above
      -
        handle: bedrooms_max
        field:
          type: integer
          display: 'Bedrooms (up to)'
          instructions: 'Only for developments with a range of home sizes. Set the largest here and the listing shows e.g. "1-3 bedrooms". Leave empty when every home has the same number.'
          icon: integer
          width: 50
          listable: false
          instructions_position: above
      -
        handle: bathrooms
        field:
          type: integer
          display: Bathrooms
          instructions: 'Smallest home in the development. On its own this shows as e.g. "2 bathrooms".'
          icon: integer
          width: 50
          listable: false
          instructions_position: above
      -
        handle: bathrooms_max
        field:
          type: integer
          display: 'Bathrooms (up to)'
          instructions: 'Only for developments with a range of home sizes. Set the largest here and the listing shows e.g. "1-3 bathrooms". Leave empty when every home has the same number.'
          icon: integer
          width: 50
          listable: false
          instructions_position: above
      -
        handle: images
        field:
          mode: list
          restrict: false
          allow_uploads: false
          show_filename: true
          display: Images
          type: assets
          icon: assets
          listable: false
          instructions_position: above
      -
        handle: description
        field:
          antlers: false
          display: Description
          type: textarea
          icon: textarea
          listable: false
          instructions_position: above
      -
        handle: link
        field: link.text
        config:
          display: Link
          width: 75
          instructions: 'Link for the development card'
      -
        handle: target_blank
        field:
          default: false
          display: 'Target blank'
          type: toggle
          icon: toggle
          instructions: 'Open the link in a new tab'
          width: 25
          listable: false
          instructions_position: above
          visibility: visible
          always_save: false
      -
        import: buttons
  detail:
    display: 'Development detail'
    instructions: 'Content for this development''s own page at /developments/{slug}. Only used when Template (in the sidebar) is set to development-detail — leave empty otherwise.'
    fields:
      -
        handle: address
        field:
          type: text
          display: Address
          instructions: 'Full street address shown on the development detail page'
          width: 50
          listable: false
          instructions_position: above
      -
        handle: map_latitude
        field:
          type: text
          display: 'Map latitude'
          instructions: 'Centre point for the development detail map'
          width: 25
          listable: false
          instructions_position: above
      -
        handle: map_longitude
        field:
          type: text
          display: 'Map longitude'
          instructions: 'Centre point for the development detail map'
          width: 25
          listable: false
          instructions_position: above
      -
        handle: stations
        field:
          type: replicator
          display: 'Nearby stations'
          listable: false
          instructions_position: above
          sets:
            station:
              display: Station
              fields:
                -
                  handle: name
                  field:
                    type: text
                    display: Name
                -
                  handle: distance
                  field:
                    type: text
                    display: Distance
                -
                  handle: latitude
                  field:
                    type: text
                    display: Latitude
                    width: 50
                -
                  handle: longitude
                  field:
                    type: text
                    display: Longitude
                    width: 50
      -
        handle: schools
        field:
          type: replicator
          display: 'Nearby schools'
          listable: false
          instructions_position: above
          sets:
            school:
              display: School
              fields:
                -
                  handle: name
                  field:
                    type: text
                    display: Name
                -
                  handle: distance
                  field:
                    type: text
                    display: Distance
                -
                  handle: latitude
                  field:
                    type: text
                    display: Latitude
                    width: 50
                -
                  handle: longitude
                  field:
                    type: text
                    display: Longitude
                    width: 50
      -
        handle: property_units
        field:
          type: replicator
          display: 'Property units'
          instructions: 'Individual homes shown on the development detail page'
          listable: false
          instructions_position: above
          sets:
            unit:
              display: Unit
              fields:
                -
                  import: property_unit
      -
        import: development_detail
  sidebar:
    display: Sidebar
    fields:
      -
        handle: listing_rank
        field:
          type: integer
          display: 'Listing rank'
          instructions: 'Ordering priority on both the public /developments listing and the drafts on /developments-preview (1 = top, 5 = lowest). Any ranked development sorts above every unranked one, so setting 5 still pins it to the top — ranks only order ranked entries against each other. Entries with the same rank fall back to the page sort, then name A–Z. Leave empty to sort after all ranked developments.'
          width: 50
          listable: false
          instructions_position: above
          validate:
            - nullable
            - integer
            - 'min:1'
            - 'max:5'
      -
        handle: template
        field:
          type: template
          display: Template
          instructions: "Controls whether this development gets its own page on the site.\n\n**development-detail** — the development gets a full page at /developments/{slug}, built from the Development detail tab. On the listing its button changes to “View development” and points at that page, so the Buttons set below (ShareToBuy and any others) are bypassed and never shown.\n\n**Leave empty** — no page of its own. The listing shows the Buttons set below, which is how visitors are sent off to ShareToBuy.\n\nEither way the development is only public once published; unpublished drafts appear on /developments-preview instead."
          folder: ''
          hide_partials: true
      -
        handle: slug
        field:
          type: slug
          localizable: true
          validate:
            - required
