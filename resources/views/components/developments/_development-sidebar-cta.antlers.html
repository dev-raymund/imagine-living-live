<div class="development-detail__cta-card">
    <div class="development-detail__cta-header">
        <div class="development-detail__cta-logo">
            {{ company_information:logo }}
                <img src="{{ url }}" alt="{{ company_information:name }}" />
            {{ /company_information:logo }}
        </div>
        <div class="development-detail__cta-developer">
            <p class="development-detail__cta-developer-name">Imagine Living</p>
            <a href="/developments-preview" class="development-detail__cta-developer-link">View developments</a>
        </div>
    </div>
    <div class="development-detail__cta-body">
        <a href="tel:{{ company_information:phone_number | replace:' ':'' }}" class="development-detail__cta-btn development-detail__cta-btn--phone">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"></path>
            </svg>
            View phone number
        </a>
        <a href="/contact-us" class="development-detail__cta-btn development-detail__cta-btn--enquire">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                <polyline points="22,6 12,13 2,6"></polyline>
            </svg>
            Request more details
        </a>
    </div>
</div>
